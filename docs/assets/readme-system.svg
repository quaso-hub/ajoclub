<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AjoClub operating model</title>
  <desc id="desc">Animated operating model from brand and intake to delivery, reusable systems, and validated platform work.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="rail" x1="120" y1="130" x2="1080" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#A16207"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="22" fill="url(#panel)" stroke="#D1D5DB"/>
  <path d="M160 130 H1040" stroke="url(#rail)" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#soft)">
    <g transform="translate(86 72)">
      <rect width="178" height="92" rx="16" fill="#FFFFFF"/>
      <text x="24" y="38" font-size="16" font-weight="800" fill="#0F172A">Brand</text>
      <text x="24" y="62" font-size="13" fill="#475569">identity and offer</text>
    </g>
    <g transform="translate(306 72)">
      <rect width="178" height="92" rx="16" fill="#FFFFFF"/>
      <text x="24" y="38" font-size="16" font-weight="800" fill="#0F172A">Intake</text>
      <text x="24" y="62" font-size="13" fill="#475569">qualified requests</text>
    </g>
    <g transform="translate(526 72)">
      <rect width="178" height="92" rx="16" fill="#FFFFFF"/>
      <text x="24" y="38" font-size="16" font-weight="800" fill="#0F172A">Delivery</text>
      <text x="24" y="62" font-size="13" fill="#475569">repeatable workflow</text>
    </g>
    <g transform="translate(746 72)">
      <rect width="178" height="92" rx="16" fill="#FFFFFF"/>
      <text x="24" y="38" font-size="16" font-weight="800" fill="#0F172A">Systems</text>
      <text x="24" y="62" font-size="13" fill="#475569">reusable patterns</text>
    </g>
    <g transform="translate(966 72)">
      <rect width="178" height="92" rx="16" fill="#FFFFFF"/>
      <text x="24" y="38" font-size="16" font-weight="800" fill="#0F172A">Product</text>
      <text x="24" y="62" font-size="13" fill="#475569">validated scope</text>
    </g>
  </g>

  <circle r="8" fill="#0F766E">
    <animateMotion dur="6s" repeatCount="indefinite" path="M160 130 H1040"/>
  </circle>
  <circle r="4" fill="#FACC15" opacity="0.9">
    <animateMotion dur="6s" begin="1.4s" repeatCount="indefinite" path="M160 130 H1040"/>
  </circle>
</svg>
